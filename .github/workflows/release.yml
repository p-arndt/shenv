name: Release

# Tag push only: `just release` (stamp) bumps VERSION, commits, tags and pushes.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # A release gate ahead of signing: a known-vulnerable stdlib or dependency
  # must not get a signature every shipped updater will accept. The shared
  # workflow has no such step, so it runs here and the release waits for it.
  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  # Assets: shenv_<version>_<os>_<arch>.tar.gz (.zip on windows) with README.md,
  # shenv_<version>_checksums.txt and its signature shenv_<version>_checksums.txt.sig
  # (written by release-sign next to the checksums file). internal/update
  # downloads exactly these names.
  release:
    needs: vuln
    uses: p-arndt/.github/.github/workflows/go-release.yml@v1
    # A called workflow gets at most what its caller grants.
    permissions:
      contents: write
    with:
      binary: shenv
      main: ./cmd/shenv
      archive-extra-files: README.md
      changelog: git-cliff
      # `shenv update` refuses unsigned releases, so signing is mandatory; the
      # shared workflow fails the release if the key is missing. The signer is
      # compiled and the signature verified with the key removed from the
      # environment: only `release-sign sign` sees RELEASE_SIGNING_KEY, not the
      # Go toolchain. `selfcheck` verifies against the public key embedded in
      # internal/update, so a key mismatch fails the release instead of
      # stranding every shipped updater.
      sign: true
      sign-command: >-
        env -u RELEASE_SIGNING_KEY go build -o "$RUNNER_TEMP/release-sign" ./cmd/release-sign &&
        "$RUNNER_TEMP/release-sign" sign "$CHECKSUMS" &&
        env -u RELEASE_SIGNING_KEY "$RUNNER_TEMP/release-sign" selfcheck "$CHECKSUMS"
    secrets:
      signing-key: ${{ secrets.RELEASE_SIGNING_KEY }}
