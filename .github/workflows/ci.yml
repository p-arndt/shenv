name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # vet, test, build per OS plus a gofmt check. Windows is in the matrix on
  # purpose: the self-updater's binary swap and the keychain integration have
  # Windows-specific code paths a Linux-only CI would never execute. No macOS:
  # shenv never ran CI there.
  ci:
    uses: p-arndt/.github/.github/workflows/go-ci.yml@v1
    with:
      os: '["ubuntu-latest", "windows-latest"]'
      race: false

  # Not part of the shared workflow. Run per OS: the stdlib is compiled in, so
  # symbol reachability differs per platform. Pinned by version rather than
  # added as an action, like everything this repo executes.
  vuln:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true
          cache: true

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
